<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg Hunt</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&amp;id=1MIUpRTwcaOC&amp;format=png&amp;color=000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20261F;
    --ink-soft:#3A4238;
    --paper:#F4F0E4;
    --line: rgba(32,38,31,0.14);
    --unseen:#3E6E77;   --unseen-ink:#EAF2F1;
    --applied:#5C7A3A;  --applied-ink:#F2F4E9;
    --declined:#9C4A3C; --declined-ink:#F7EBE7;
    --maybe:#B6862E;    --maybe-ink:#FBF1DE;
    --radius: 6px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--ink);
    background-image: radial-gradient(circle at 1px 1px, rgba(244,240,228,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    font-family:'Inter', sans-serif; color: var(--paper);
    display:flex; justify-content:center; padding: 56px 20px 80px;
  }
  .page{ width:100%; max-width: 780px; }
  .masthead{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom: 44px; flex-wrap:wrap; }
  .file-no{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(244,240,228,0.5); display:inline-flex; align-items:center; gap:8px;
    padding: 4px 10px; border: 1px solid rgba(244,240,228,0.22); border-radius: 100px; margin-bottom: 22px;
  }
  .file-no::before{ content:""; width:6px; height:6px; border-radius:50%; background: var(--maybe); display:inline-block; }
  .file-no.ok::before{ background: var(--applied); }
  .file-no.err::before{ background: var(--declined); }
  h1{ font-family:'Fraunces', serif; font-weight: 500; font-size: clamp(36px, 6vw, 52px); line-height: 1.05; margin: 0 0 12px; letter-spacing: -0.01em; }
  .masthead p{ font-size: 17px; color: rgba(244,240,228,0.62); margin:0; max-width: 42ch; line-height: 1.6; }
  .refresh{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform:uppercase;
    background: transparent; border: 1px solid rgba(244,240,228,0.3); color: var(--paper);
    padding: 10px 16px; border-radius: 100px; cursor:pointer; display:flex; align-items:center; gap:8px;
    transition: background 0.15s ease; flex-shrink:0;
  }
  .refresh:hover{ background: rgba(244,240,228,0.08); }
  .refresh svg{ width:14px; height:14px; transition: transform 0.4s ease; }
  .refresh.spin svg{ transform: rotate(360deg); }
  .btn-row{ display:flex; gap:10px; flex-shrink:0; flex-wrap:wrap; }
  .connect{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform:uppercase;
    background: rgba(182,134,46,0.16); border: 1px solid var(--maybe); color: var(--maybe-ink);
    padding: 10px 16px; border-radius: 100px; cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .connect.on{ background: rgba(92,122,58,0.2); border-color: var(--applied); color: var(--applied-ink); }
  .connect svg{ width:14px; height:14px; }
  .sync-note{ font-size:11px; margin-top:6px; color: rgba(244,240,228,0.5); }
  .sync-note.warn{ color: var(--maybe-ink); background: rgba(182,134,46,0.16); display:inline-block; padding:3px 9px; border-radius:100px; }

  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 620px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    position:relative; background: var(--paper); border-radius: var(--radius);
    padding: 30px 24px 24px; text-align:left; cursor:pointer; border: none; font-family: inherit; color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    display:flex; flex-direction:column; gap: 14px; width:100%;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.28); }
  .card:focus-visible{ outline: 2px solid var(--paper); outline-offset: 3px; }
  .card:active{ transform: translateY(-1px); }

  .tab{ position:absolute; top:0; left: 22px; transform: translateY(-100%); font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 12px 9px; border-radius: 5px 5px 0 0; }
  .card--unseen .tab{ background: var(--unseen); color: var(--unseen-ink); }
  .card--applied .tab{ background: var(--applied); color: var(--applied-ink); }
  .card--declined .tab{ background: var(--declined); color: var(--declined-ink); }
  .card--maybe .tab{ background: var(--maybe); color: var(--maybe-ink); }

  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .icon{ width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; border-radius: 50%; flex-shrink:0; }
  .icon svg{ width:18px; height:18px; }
  .card--unseen .icon{ background: rgba(62,110,119,0.14); color: var(--unseen); }
  .card--applied .icon{ background: rgba(92,122,58,0.14); color: var(--applied); }
  .card--declined .icon{ background: rgba(156,74,60,0.14); color: var(--declined); }
  .card--maybe .icon{ background: rgba(182,134,46,0.16); color: var(--maybe); }

  .stamp{ font-family:'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; line-height:1; transform: rotate(-3deg); }
  .card--unseen .stamp{ color: var(--unseen); }
  .card--applied .stamp{ color: var(--applied); }
  .card--declined .stamp{ color: var(--declined); }
  .card--maybe .stamp{ color: var(--maybe); }

  .card-title{ font-family:'Fraunces', serif; font-size: 20px; font-weight: 500; margin: 0; }
  .card-desc{ font-size: 14px; color: var(--ink-soft); margin: -6px 0 0; line-height:1.5; }
  .card-foot{ margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.05em; color: rgba(32,38,31,0.5); display:flex; align-items:center; justify-content:space-between; }
  .card-foot .go{ transition: transform 0.15s ease; }
  .card:hover .card-foot .go{ transform: translateX(3px); }

  footer{ margin-top: 44px; font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: rgba(244,240,228,0.4); letter-spacing: 0.04em; }

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background: rgba(15,18,14,0.72); display:none;
    align-items:flex-start; justify-content:center; padding: 48px 20px; overflow-y:auto; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{ width:100%; max-width: 720px; background: var(--paper); color: var(--ink); border-radius: 10px; overflow:hidden; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 24px 30px; border-bottom: 1px solid var(--line); }
  .modal-head h2{ font-family:'Fraunces', serif; font-weight:500; font-size:24px; margin:0; }
  .modal-close{ background:none; border:none; cursor:pointer; color: var(--ink-soft); padding:6px; }
  .modal-close svg{ width:20px; height:20px; }
  .modal-body{ padding: 12px 30px 30px; max-height: 70vh; overflow-y:auto; }
  .empty{ padding: 44px 0; text-align:center; color: var(--ink-soft); font-size:15px; }

  .job{ border-bottom: 1px solid var(--line); padding: 26px 0; display:flex; flex-direction:column; gap:12px; }
  .job:last-child{ border-bottom:none; }
  .job-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .job-title{ font-family:'Fraunces', serif; font-size:21px; font-weight:500; margin:0; line-height:1.3; }
  .job-chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .job-chip{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: var(--ink-soft); letter-spacing:0.02em;
    background: rgba(32,38,31,0.06); padding: 4px 10px; border-radius: 100px; white-space:nowrap; }
  .job-desc{ font-size:15.5px; color: var(--ink); opacity:0.78; line-height:1.68; margin:0; max-width: 62ch; }
  .job-links{ display:flex; gap:18px; flex-wrap:wrap; }
  .job-links a{ font-size:14px; color: var(--unseen); text-decoration:none; font-weight:500; }
  .job-links a:hover{ text-decoration:underline; }
  .job-rating{ font-size:13.5px; color: var(--maybe); font-weight:500; flex-shrink:0; }

  .job-actions{ display:flex; gap:10px; margin-top:6px; }
  .act{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color: var(--ink-soft); transition: all 0.12s ease; }
  .act svg{ width:17px; height:17px; }
  .act:hover{ transform: translateY(-1px); }
  .act.applied:hover, .act.applied.active{ background: var(--applied); border-color: var(--applied); color: var(--applied-ink); }
  .act.declined:hover, .act.declined.active{ background: var(--declined); border-color: var(--declined); color: var(--declined-ink); }
  .act.maybe:hover, .act.maybe.active{ background: var(--maybe); border-color: var(--maybe); color: var(--maybe-ink); }
  .act.reset{ margin-left:auto; }
  .act.reset:hover{ background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* ---- comments ---- */
  .act.comment{ position:relative; }
  .act.comment:hover, .act.comment.active{ background: var(--unseen); border-color: var(--unseen); color: var(--unseen-ink); }
  .act.comment .dot{ position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%;
    background: var(--maybe); border:2px solid var(--paper); display:none; }
  .act.comment.has-comment .dot{ display:block; }

  .comment-preview{
    display:none; font-size:14.5px; line-height:1.6; color: var(--ink); opacity:0.82; white-space:pre-wrap;
    background: rgba(62,110,119,0.07); border-left: 2px solid var(--unseen);
    border-radius: 0 var(--radius) var(--radius) 0; padding: 11px 14px; margin-top:4px; max-width: 62ch;
  }
  .comment-preview.show{ display:block; }

  .comment-box{ display:none; flex-direction:column; gap:10px; margin-top:4px; max-width: 62ch; }
  .comment-box.open{ display:flex; }
  .comment-box textarea{
    width:100%; min-height:82px; resize:vertical; font-family:'Inter', sans-serif; font-size:14.5px; line-height:1.55;
    color: var(--ink); background:#fff; border:1px solid var(--line); border-radius: var(--radius); padding:12px 14px;
  }
  .comment-box textarea:focus{ outline:none; border-color: var(--unseen); box-shadow: 0 0 0 3px rgba(62,110,119,0.16); }
  .comment-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .comment-save, .comment-cancel{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:9px 16px; border-radius:100px; cursor:pointer;
  }
  .comment-save{ background: var(--unseen); border:1px solid var(--unseen); color: var(--unseen-ink); }
  .comment-save[disabled]{ opacity:0.55; cursor:default; }
  .comment-cancel{ background:transparent; border:1px solid var(--line); color: var(--ink-soft); }
  .comment-cancel:hover{ background: rgba(32,38,31,0.06); }
  .comment-state{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: rgba(32,38,31,0.55); }

  @media (prefers-reduced-motion: reduce){ .card, .card-foot .go, .refresh svg{ transition:none; } }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <div>
      <span class="file-no" id="statusPill">Connecting to sheet…</span>
      <h1>Egg Hunt 2.0 🐰🎉</h1>
      <p>Our Main goal is to get punkpunk job by end of 2026. who will come first choppa or punkpunk's job?</p>
    </div>
    <div>
      <div class="btn-row">
        <button class="refresh" id="refreshBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          Refresh
        </button>
        <button class="connect" id="connectBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span id="connectLabel">Connect Google account</span>
        </button>
      </div>
    </div>
  </div>

  <div class="grid">
    <button class="card card--unseen" type="button" data-status="unseen">
      <span class="tab">Husky 01</span>
      <div class="card-top">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <span class="stamp" id="count-unseen">0</span>
      </div>
      <p class="card-title">Unseen</p>
      <p class="card-desc">New listings, not looked at yet.</p>
      <div class="card-foot"><span>OPEN HUSKY</span><span class="go">→</span></div>
    </button>

    <button class="card card--applied" type="button" data-status="applied">
      <span class="tab">Husky 02</span>
      <div class="card-top">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span class="stamp" id="count-applied">0</span>
      </div>
      <p class="card-title">Applied</p>
      <p class="card-desc">Application already sent.</p>
      <div class="card-foot"><span>OPEN HUSKY</span><span class="go">→</span></div>
    </button>

    <button class="card card--declined" type="button" data-status="declined">
      <span class="tab">Husky 03</span>
      <div class="card-top">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></span>
        <span class="stamp" id="count-declined">0</span>
      </div>
      <p class="card-title">Declined</p>
      <p class="card-desc">Passed on — not a fit.</p>
      <div class="card-foot"><span>OPEN HUSKY</span><span class="go">→</span></div>
    </button>

    <button class="card card--maybe" type="button" data-status="maybe">
      <span class="tab">Husky 04</span>
      <div class="card-top">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
        <span class="stamp" id="count-maybe">0</span>
      </div>
      <p class="card-title">Maybe later</p>
      <p class="card-desc">Undecided — worth a second look.</p>
      <div class="card-foot"><span>OPEN HUSKY</span><span class="go">→</span></div>
    </button>
  </div>

  <footer id="footNote">Pulls live from your Google Sheet.</footer>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Hamper</h2>
      <button class="modal-close" id="modalClose" aria-label="Close" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // ---- CONFIG — fill these in after completing the Google Cloud setup ----
  const SHEET_ID = "1SqiNJ0ek-fIMo-Z8VZnxBcC1ucxWXEg_e9eOhJU5rFg";
  const GID = "0";
  const SHEET_NAME = "Sheet1";              // must match your tab's exact name (for writing)
  const OAUTH_CLIENT_ID = "637353908258-b8lbgkuhjjpt06sbto1sn26dakfaqaku.apps.googleusercontent.com";
  // ---------------------------------------------------------------------

  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
  const STORE_KEY = "eggHuntStatuses"; // local fallback, used only until the sheet has a Status column
  const COMMENT_STORE_KEY = "eggHuntComments"; // same idea, for the Comments column
  const STATUS_VALUES = { applied:"Applied", declined:"Declined", maybe:"Maybe later", unseen:"" };

  let jobs = [];
  let statusColIdx = -1;      // 0-based column index of "Status" header
  let statusUpdatedColIdx = -1;
  let commentColIdx = -1;     // 0-based column index of "Comments" header
  let accessToken = null;
  let tokenClient = null;

  // ---- CSV parsing (handles quoted fields with commas/newlines) ----
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i=0; i<text.length; i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else{ field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ /* skip */ }
        else{ field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function colIndexToLetter(idx){
    let n = idx + 1, letter = "";
    while(n > 0){ const rem = (n - 1) % 26; letter = String.fromCharCode(65 + rem) + letter; n = Math.floor((n - 1) / 26); }
    return letter;
  }

  function rowsToJobs(rows){
    const [header, ...body] = rows;
    const normalizedHeader = header.map(h => String(h || "").trim().toLowerCase());
    statusColIdx = normalizedHeader.indexOf("status");
    statusUpdatedColIdx = normalizedHeader.indexOf("status updated");
    commentColIdx = normalizedHeader.indexOf("comments");
    if(commentColIdx === -1) commentColIdx = normalizedHeader.indexOf("comment");

    return body
      .map((r, bodyIdx) => ({ r, bodyIdx }))
      .filter(({r}) => r.some(cell => cell && cell.trim().length))
      .map(({r, bodyIdx}) => {
        const [title, location, description, careerLink, websiteLink, applyLink, foundOn, postedOn, postedOnEgg, rating] = r;

        // Keep the real spreadsheet row even when there are blank rows between jobs.
        const rowNumber = bodyIdx + 2;
        const key = `row:${rowNumber}`;

        const rawSheetStatus = statusColIdx > -1 ? (r[statusColIdx] || "").trim() : "";
        const sheetStatus = Object.keys(STATUS_VALUES).find(
          k => STATUS_VALUES[k].toLowerCase() === rawSheetStatus.toLowerCase()
        ) || "unseen";

        const sheetComment = commentColIdx > -1 ? (r[commentColIdx] || "").trim() : "";

        return {
          key, rowNumber, sheetComment,
          title:title||"Untitled role", location:location||"", description:description||"",
          careerLink:careerLink||"", websiteLink:websiteLink||"", applyLink:applyLink||"",
          foundOn:foundOn||"", postedOn:postedOn||"", postedOnEgg:postedOnEgg||"", rating:rating||"",
          sheetStatus
        };
      });
  }

  function getLocalStatuses(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function setLocalStatus(key, status){
    const s = getLocalStatuses();
    if(status === "unseen") delete s[key]; else s[key] = status;
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  }

  function getLocalComments(){
    try{ return JSON.parse(localStorage.getItem(COMMENT_STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function setLocalComment(key, text){
    const c = getLocalComments();
    if(!text) delete c[key]; else c[key] = text;
    localStorage.setItem(COMMENT_STORE_KEY, JSON.stringify(c));
  }

  function commentOf(job){
    if(commentColIdx > -1 && job.sheetComment) return job.sheetComment;
    return getLocalComments()[job.key] || "";
  }

  function statusOf(job){
    // trust the sheet once it actually has a value written; otherwise fall back
    // to this browser's local copy so nothing reverts before a sync completes
    if(statusColIdx > -1 && job.sheetStatus) return job.sheetStatus;
    return getLocalStatuses()[job.key] || "unseen";
  }

  function renderCounts(){
    const counts = { unseen:0, applied:0, declined:0, maybe:0 };
    jobs.forEach(j => { counts[statusOf(j)]++; });
    Object.keys(counts).forEach(k => {
      const el = document.getElementById("count-"+k);
      if(el) el.textContent = counts[k];
    });
  }

  // Re-run a request once after silently refreshing an expired token.
  async function refreshTokenAndRetry(fn){
    let res = await fn();
    if(res.status !== 401 || !tokenClient) return res;

    await new Promise(resolve => {
      const oldCallback = tokenClient.callback;
      tokenClient.callback = (resp) => {
        if(resp.access_token) accessToken = resp.access_token;
        tokenClient.callback = oldCallback;
        resolve();
      };
      tokenClient.requestAccessToken({ prompt:"" });
    });
    return fn();
  }

  function writeCell(rowNumber, colIdx, value){
    const range = `${SHEET_NAME}!${colIndexToLetter(colIdx)}${rowNumber}`;
    return refreshTokenAndRetry(() => fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,
      {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ range, majorDimension:"ROWS", values:[[value]] })
      }
    ));
  }

  async function failureReason(res, label){
    let detail = "";
    try {
      const err = await res.json();
      detail = err?.error?.message ? ": " + err.error.message : "";
    } catch(_){}
    return label + "-http-" + res.status + detail;
  }

  async function writeStatusToSheet(job, status){
    if(!accessToken) return { ok:false, reason:"not-connected" };
    if(statusColIdx === -1) return { ok:false, reason:"no-status-column" };

    try{
      // Write Status first, then Status Updated. Separate writes make it much
      // easier to diagnose and avoid batch-update issues with later rows.
      const statusRes = await writeCell(job.rowNumber, statusColIdx, STATUS_VALUES[status] || "");
      if(!statusRes.ok) return { ok:false, reason: await failureReason(statusRes, "status") };

      if(statusUpdatedColIdx > -1){
        const updatedRes = await writeCell(job.rowNumber, statusUpdatedColIdx, new Date().toISOString());
        if(!updatedRes.ok) return { ok:false, reason: await failureReason(updatedRes, "status-updated") };
      }

      return { ok:true };
    } catch(e){
      return { ok:false, reason:"network" };
    }
  }

  async function writeCommentToSheet(job, text){
    if(!accessToken) return { ok:false, reason:"not-connected" };
    if(commentColIdx === -1) return { ok:false, reason:"no-comments-column" };

    try{
      const res = await writeCell(job.rowNumber, commentColIdx, text);
      if(!res.ok) return { ok:false, reason: await failureReason(res, "comment") };
      return { ok:true };
    } catch(e){
      return { ok:false, reason:"network" };
    }
  }

  const overlay = document.getElementById("overlay");
  const modalBody = document.getElementById("modalBody");
  const modalTitle = document.getElementById("modalTitle");

  const labels = { unseen:"Unseen", applied:"Applied", declined:"Declined", maybe:"Maybe later" };

  function openHamper(status){
    modalTitle.textContent = labels[status];
    const list = jobs.filter(j => statusOf(j) === status);
    if(!list.length){
      modalBody.innerHTML = `<div class="empty">Nothing in this husky right now.</div>`;
    } else {
      modalBody.innerHTML = list.map(j => jobRow(j, status)).join("");
    }
    if(statusColIdx === -1){
      modalBody.innerHTML = `<div class="sync-note warn">No "Status" column found in your sheet yet — using this browser only until you add one.</div>` + modalBody.innerHTML;
    }
    overlay.classList.add("open");
  }

  function jobRow(j, currentStatus){
    const chips = [j.location, j.foundOn, j.postedOn].filter(Boolean);
    const comment = commentOf(j);
    return `
      <div class="job" data-key="${escapeAttr(j.key)}">
        <div class="job-top">
          <p class="job-title">${escapeHtml(j.title)}</p>
          ${j.rating ? `<span class="job-rating">$ ${escapeHtml(j.rating)}</span>` : ""}
        </div>
        ${chips.length ? `<div class="job-chips">${chips.map(c => `<span class="job-chip">${escapeHtml(c)}</span>`).join("")}</div>` : ""}
        ${j.description ? `<p class="job-desc">${escapeHtml(j.description)}</p>` : ""}
        <div class="job-links">
          ${j.applyLink ? `<a href="${escapeAttr(j.applyLink)}" target="_blank" rel="noopener">Apply now →</a>` : ""}
          ${j.careerLink ? `<a href="${escapeAttr(j.careerLink)}" target="_blank" rel="noopener">Career page →</a>` : ""}
          ${j.websiteLink ? `<a href="${escapeAttr(j.websiteLink)}" target="_blank" rel="noopener">Company site →</a>` : ""}
        </div>
        <div class="job-actions">
          <button class="act applied ${currentStatus==='applied'?'active':''}" title="Mark applied" data-action="applied">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <button class="act declined ${currentStatus==='declined'?'active':''}" title="Mark declined" data-action="declined">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
          </button>
          <button class="act maybe ${currentStatus==='maybe'?'active':''}" title="Mark maybe later" data-action="maybe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          </button>
          <button class="act comment ${comment ? 'has-comment' : ''}" type="button"
                  title="${comment ? 'Edit comment' : 'Add a comment'}" data-action="comment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="dot" aria-hidden="true"></span>
          </button>
          <button class="act reset" title="Back to unseen" data-action="unseen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 3v6h6"/></svg>
          </button>
        </div>
        <div class="comment-preview ${comment ? 'show' : ''}">${escapeHtml(comment)}</div>
        <div class="comment-box">
          <textarea placeholder="Leave a note about this role…" aria-label="Comment">${escapeHtml(comment)}</textarea>
          <div class="comment-row">
            <button class="comment-save" type="button">Save comment</button>
            <button class="comment-cancel" type="button">Cancel</button>
            <span class="comment-state"></span>
          </div>
        </div>
      </div>`;
  }

  // Keep the bubble, preview, and dot in sync with whatever is currently saved.
  function refreshCommentUI(jobEl, job){
    const text = commentOf(job);
    const preview = jobEl.querySelector(".comment-preview");
    const bubble = jobEl.querySelector('.act[data-action="comment"]');
    const box = jobEl.querySelector(".comment-box");
    const isOpen = box.classList.contains("open");

    preview.textContent = text;
    preview.classList.toggle("show", !!text && !isOpen);
    bubble.classList.toggle("has-comment", !!text);
    bubble.classList.toggle("active", isOpen);
    bubble.title = text ? "Edit comment" : "Add a comment";
  }

  function closeCommentBox(jobEl, job){
    jobEl.querySelector(".comment-box").classList.remove("open");
    refreshCommentUI(jobEl, job);
  }

  async function saveComment(jobEl, job){
    const box = jobEl.querySelector(".comment-box");
    const saveBtn = box.querySelector(".comment-save");
    const state = box.querySelector(".comment-state");
    const text = box.querySelector("textarea").value.trim();

    job.sheetComment = text;      // optimistic, in-memory
    setLocalComment(job.key, text); // instant persistence in this browser

    if(commentColIdx === -1){
      state.textContent = "Saved in this browser only.";
      footNote.textContent = 'Add a "Comments" column to your sheet to sync comments into it.';
      closeCommentBox(jobEl, job);
      return;
    }
    if(!accessToken){
      state.textContent = "Saved in this browser only.";
      footNote.textContent = "Comment saved here — connect your Google account to sync it into the sheet.";
      closeCommentBox(jobEl, job);
      return;
    }

    state.textContent = "Saving…";
    saveBtn.disabled = true;
    const result = await writeCommentToSheet(job, text);
    saveBtn.disabled = false;

    if(result.ok){
      footNote.textContent = "Comment saved to the sheet.";
      closeCommentBox(jobEl, job);
    } else {
      state.textContent = "Saved in this browser only.";
      footNote.textContent = "Comment saved locally, but couldn't write to the sheet (" + result.reason + "). Try refreshing your connection.";
    }
  }

  modalBody.addEventListener("click", async (e) => {
    const jobEl = e.target.closest(".job");
    if(!jobEl) return;
    const key = jobEl.getAttribute("data-key");
    const job = jobs.find(j => String(j.key) === String(key));
    if(!job) return;

    // ---- comment bubble ----
    if(e.target.closest('.act[data-action="comment"]')){
      const box = jobEl.querySelector(".comment-box");
      const isOpen = box.classList.toggle("open");
      if(isOpen) box.querySelector("textarea").value = commentOf(job);
      refreshCommentUI(jobEl, job);
      if(isOpen) box.querySelector("textarea").focus();
      return;
    }
    if(e.target.closest(".comment-cancel")){
      closeCommentBox(jobEl, job);
      return;
    }
    if(e.target.closest(".comment-save")){
      await saveComment(jobEl, job);
      return;
    }

    // ---- status buttons ----
    const btn = e.target.closest(".act");
    if(!btn) return;
    const newStatus = btn.dataset.action;

    const previousStatus = statusOf(job);
    job.sheetStatus = newStatus;         // optimistic, in-memory
    setLocalStatus(key, newStatus);      // local fallback / instant persistence

    renderCounts();
    const currentStatusKey = Object.keys(labels).find(k => labels[k] === modalTitle.textContent) || "unseen";
    openHamper(currentStatusKey);

    if(accessToken){
      const result = await writeStatusToSheet(job, newStatus);
      if(result.ok){
        footNote.textContent = "Status and status updated saved to the sheet.";
      } else {
        job.sheetStatus = previousStatus;
        setLocalStatus(key, newStatus);
        renderCounts();
        openHamper(currentStatusKey);
        footNote.textContent = "Saved locally, but couldn't write to the sheet (" + result.reason + "). Try refreshing your connection.";
      }
    } else if(statusColIdx > -1){
      footNote.textContent = "Saved in this browser only — connect your Google account to sync it into the sheet.";
    }
  });

  modalBody.addEventListener("keydown", async (e) => {
    if(!e.target.matches(".comment-box textarea")) return;
    const jobEl = e.target.closest(".job");
    const job = jobs.find(j => String(j.key) === String(jobEl.getAttribute("data-key")));
    if(!job) return;

    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      await saveComment(jobEl, job);
    } else if(e.key === "Escape"){
      e.stopPropagation();   // close the box, not the whole modal
      closeCommentBox(jobEl, job);
    }
  });

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openHamper(card.dataset.status));
  });
  document.getElementById("modalClose").addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if(e.target === overlay) overlay.classList.remove("open"); });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") overlay.classList.remove("open"); });

  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(str){ return escapeHtml(str); }
  function truncate(str, n){ return str.length > n ? str.slice(0, n).trim() + "…" : str; }

  const pill = document.getElementById("statusPill");
  const footNote = document.getElementById("footNote");
  const refreshBtn = document.getElementById("refreshBtn");

  async function loadJobs(){
    pill.className = "file-no";
    pill.textContent = "Connecting to sheet…";
    refreshBtn.classList.add("spin");
    try{
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      jobs = rowsToJobs(rows);
      renderCounts();
      pill.className = "file-no ok";
      pill.textContent = jobs.length + " roles synced";
      footNote.textContent = "Last synced " + new Date().toLocaleString() + ". Status choices are saved to the sheet when connected.";
    } catch(err){
      pill.className = "file-no err";
      pill.textContent = "Couldn't reach the sheet";
      footNote.textContent = "Make sure the sheet's sharing is set to \"Anyone with the link – Viewer\", then hit refresh.";
    } finally {
      refreshBtn.classList.remove("spin");
    }
  }

  refreshBtn.addEventListener("click", loadJobs);
  loadJobs();

  // ---- Google sign-in ----
  const connectBtn = document.getElementById("connectBtn");
  const connectLabel = document.getElementById("connectLabel");

  function initTokenClient(){
    if(!window.google || OAUTH_CLIENT_ID.startsWith("PASTE_")) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: OAUTH_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/spreadsheets",
      callback: (resp) => {
        if(resp.access_token){
          accessToken = resp.access_token;
          connectBtn.classList.add("on");
          connectLabel.textContent = "Connected";
          footNote.textContent = "Connected. Changes now write straight into your sheet.";
        }
      }
    });
  }

  connectBtn.addEventListener("click", () => {
    if(OAUTH_CLIENT_ID.startsWith("PASTE_")){
      footNote.textContent = "This page needs a Google OAuth Client ID configured before it can connect.";
      return;
    }
    if(!tokenClient) initTokenClient();
    if(tokenClient) tokenClient.requestAccessToken();
  });

  window.addEventListener("load", initTokenClient);
</script>
</body>
</html>
